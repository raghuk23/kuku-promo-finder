# All tunable numbers live here, not in code, so they can be argued with.

llm:
  # gemini | openai_compatible | heuristic. Override per run with LLM_PROVIDER /
  # LLM_MODEL env vars -- swapping models is one env var, no code change.
  # `heuristic` uses no LLM at all: offline fallback AND the ablation baseline.
  provider: gemini
  model: gemini-3.6-flash   # verified by scripts/smoke_test.py on 2026-11-08
  # Tried in order if the primary stays overloaded. Each result records the model
  # that actually answered, because mixing models makes scores non-comparable.
  fallback_models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.5-flash]
  temperature: 0
  seed: 7
  retries: 4                # per model, exponential backoff, transient errors only
  base_delay_s: 4
  min_interval_s: 4         # pacing between calls on the free tier
  openai_compatible:        # OpenRouter, Groq, Anthropic's OpenAI-compatible endpoint, ...
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENAI_COMPAT_API_KEY

judge:
  context_pad_s: 8          # beats shown before/after each cut so the LLM can move it

window:
  min_s: 20                 # brief: promos are 20-60 seconds
  max_s: 60
  hook_s: 3                 # brief: "something in the first 3 seconds"
  cliff_s: 4                # how much of the ending counts as "the cut"
  sweet_spot_s: [30, 45]    # length_fit = 1.0 inside, falling to 0.5 at 20s / 60s
  boundary_eps_s: 0.05

candidates:
  seconds_per_candidate: 25 # K = clamp(round(duration / 25), k_min, k_max)
  k_min: 3
  k_max: 8
  nms_iou: 0.5

# Stage 2 heuristic score. Hook weighted highest: on a feed the first 3s
# decide whether the other 57 are ever watched.
heuristic_weights:
  hook: 0.30
  cliffhanger: 0.25
  intensity: 0.15
  conflict: 0.15
  speakers: 0.10
  length_fit: 0.05
